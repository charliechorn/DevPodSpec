<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABA Exchange Rate Widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #333;
            font-family: 'Work Sans', sans-serif;
        }
        
        .widget-container {
            position: relative;
            width: 170px;
            height: 100px;
            border-radius: 12px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(54px);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }
        
        .widget-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 51, 51, 0.1);
            z-index: -1;
        }
        
        .circle-overlay {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.12);
            top: -30px;
            left: -50px;
        }
        
        .widget-content {
            position: relative;
            width: 100%;
            height: 100%;
            padding: 12px;
            display: flex;
            flex-direction: column;
            color: white;
        }
        
        .top-row {
            display: flex;
            align-items: center;
        }
        
        .aba-logo {
            width: 24px;
            height: 24px;
            margin-right: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }
        
        .exchange-text {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.24px;
        }
        
        .currency-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: flex-end;
        }
        
        .currency-code {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.24px;
            text-align: right;
            margin-bottom: 4px;
        }
        
        .exchange-rate-container {
            text-align: right;
            margin-bottom: 4px;
        }
        
        .exchange-rate {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: -0.24px;
        }
        
        .exchange-rate-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: -0.2px;
            opacity: 0.7;
        }
        
        .date {
            font-size: 10px;
            font-weight: 400;
            letter-spacing: -0.2px;
            text-align: right;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <div class="circle-overlay"></div>
        <div class="widget-content">
            <div class="top-row">
                <div class="aba-logo">ABA</div>
                <div class="exchange-text">Exchange</div>
            </div>
            <div class="currency-section">
                <div class="currency-code">USD</div>
                <div class="exchange-rate-container">
                    <div class="exchange-rate">4098 KHR</div>
                    <div class="exchange-rate-label">1 USD =</div>
                </div>
                <div class="date">23 AUG</div>
            </div>
        </div>
    </div>

    <script>
        // Update the date to current date
        document.addEventListener('DOMContentLoaded', () => {
            const dateElement = document.querySelector('.date');
            const now = new Date();
            const day = now.getDate().toString().padStart(2, '0');
            const month = new Intl.DateTimeFormat('en', { month: 'short' }).format(now).toUpperCase();
            dateElement.textContent = `${day} ${month}`;
        });
    </script>
</body>
</html>
